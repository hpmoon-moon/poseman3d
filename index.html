<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoseMan 3D v4</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4f8;color:#302536;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:14px 18px;background:#fff;font-size:21px;font-weight:800}header span{color:#d75b9c}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1250px;margin:auto}#view{height:76vh;min-height:470px;background:linear-gradient(#fff,#f3eaf2);border-radius:18px;overflow:hidden;position:relative;touch-action:none}aside{background:white;border-radius:18px;padding:16px;max-height:82vh;overflow:auto}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px;background:#f0dfed;cursor:pointer}button.primary{background:#c94d95;color:white}button:disabled{opacity:.5}#status{font-size:13px;color:#6d5b6a;min-height:32px;margin:10px 0}.group{border-top:1px solid #eee;padding-top:14px;margin-top:15px}.hint{font-size:12px;color:#756a76;line-height:1.5}#overlay{position:absolute;top:10px;left:10px;background:#ffffffcc;padding:8px;border-radius:8px;font-size:12px;z-index:1}#reference{max-width:100%;max-height:190px;object-fit:contain;display:none;margin-top:8px}#result{width:100%;display:none;border:1px solid #ddd;border-radius:12px;margin-top:10px}canvas{display:block}@media(max-width:760px){main{display:block;padding:8px}#view{height:54vh;min-height:360px}aside{margin-top:10px;max-height:none}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header>PoseMan <span>3D v4</span></header><main><div id="view"><div id="overlay">ドラッグ：回転 ／ ピンチ：拡大</div></div><aside><b>写真からポーズを自動再現</b><p class="hint">人物の全身が写った写真を選んでください。初回はインターネット接続が必要です。</p><input id="file" type="file" accept="image/*"><img id="reference" alt="参考画像"><div style="margin-top:10px"><button class="primary" id="detect">写真から自動再現</button> <button id="reset">基本姿勢</button></div><div id="status" role="status">読み込み中…</div><div class="group"><b>足裏ハイライト</b><p class="hint">左右の足裏を白ピンク色でやさしく発光させています（固定）。</p></div><div class="group"><button class="primary" id="png">PNGを表示</button><p class="hint">下に表示された画像を長押しして保存できます。</p><img id="result" alt="生成した透過PNG"></div><p class="hint">MediaPipeによる主要関節の近似再現。手指・足指や隠れた関節の精密推定には対応していません。</p></aside></main><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
try{
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(0,1.6,8.6);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;$('view').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.6,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=15;scene.add(new THREE.HemisphereLight(0xffffff,0xbfa2ba,2.3));let light=new THREE.DirectionalLight(0xffffff,2.6);light.position.set(-3,6,6);scene.add(light);let fill=new THREE.DirectionalLight(0xffc0de,1);fill.position.set(4,3,-4);scene.add(fill);
const pink=new THREE.MeshStandardMaterial({color:0xed80ae,roughness:.65}),soleMat=new THREE.MeshStandardMaterial({color:0xffddec,emissive:0xffb6db,emissiveIntensity:.42,roughness:.58});const sphere=new THREE.SphereGeometry(1,32,24),body=new THREE.Group();scene.add(body);const V=(x,y,z=0)=>new THREE.Vector3(x,y,z);const base={nose:V(0,3.42),left_shoulder:V(-.55,2.79),right_shoulder:V(.55,2.79),left_elbow:V(-.88,2.35),right_elbow:V(.88,2.35),left_wrist:V(-1.03,1.91),right_wrist:V(1.03,1.91),left_hip:V(-.27,1.62),right_hip:V(.27,1.62),left_knee:V(-.31,.93),right_knee:V(.31,.93),left_ankle:V(-.32,.19),right_ankle:V(.32,.19),left_foot_index:V(-.35,.1,.25),right_foot_index:V(.35,.1,.25)};const copyBase=()=>Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v.clone()]));
function mesh(name,scale,pos,material=pink){let m=new THREE.Mesh(sphere,material);m.name=name;m.scale.set(...scale);m.position.copy(pos);body.add(m);return m}function link(name,a,b,r1,r2){const d=b.clone().sub(a),g=new THREE.CylinderGeometry(r2,r1,d.length(),28,1),m=new THREE.Mesh(g,pink);m.name=name;m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1),d.normalize());body.add(m);return m}
function build(j){body.clear();const hip=j.left_hip.clone().add(j.right_hip).multiplyScalar(.5),shoulder=j.left_shoulder.clone().add(j.right_shoulder).multiplyScalar(.5),center=hip.clone().add(shoulder).multiplyScalar(.5);let torso=mesh('胴体',[.43,.67,.235],center);torso.quaternion.setFromUnitVectors(V(0,1),shoulder.clone().sub(hip).normalize());mesh('腰',[.36,.26,.24],hip);const head=j.nose.clone().add(V(0,.16));mesh('頭',[.35,.44,.31],head);link('首',shoulder.clone().add(V(0,.04)),head.clone().add(V(0,-.35)),.15,.14);for(const side of ['left','right']){const n=side==='left'?'左':'右',s=j[side+'_shoulder'],e=j[side+'_elbow'],w=j[side+'_wrist'],h=j[side+'_hip'],k=j[side+'_knee'],a=j[side+'_ankle'];mesh(n+'肩',[.20,.20,.20],s);link(n+'上腕',s,e,.17,.13);mesh(n+'肘',[.135,.135,.135],e);link(n+'前腕',e,w,.13,.09);mesh(n+'手',[.13,.18,.075],w.clone().add(V(0,-.12)));mesh(n+'太もも付根',[.23,.24,.23],h);link(n+'太もも',h,k,.22,.15);mesh(n+'膝',[.155,.15,.15],k);link(n+'ふくらはぎ',k,a,.155,.105);mesh(n+'足首',[.11,.12,.11],a);mesh(n+'足裏',[.17,.09,.30],a.clone().add(V(0,-.07,.14)),soleMat);for(let i=0;i<5;i++){const dx=(i-2)*.061,finger=w.clone().add(V(dx,-.21,0)),tip=finger.clone().add(V(dx*.16,-.13+Math.abs(i-2)*.014,.015));link(n+'手指',finger,tip,.025,.019);mesh(n+'足指',[.031,.035,.067],a.clone().add(V(dx,-.085,.32)),soleMat)}}}
let current=copyBase();build(current);status('準備完了。写真を選択できます。');$('reset').onclick=()=>{current=copyBase();build(current);status('基本姿勢に戻しました。')};$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const u=URL.createObjectURL(f);$('reference').onload=()=>status('画像を読み込みました。「写真から自動再現」を押してください。');$('reference').src=u;$('reference').style.display='block'};
let landmarker=null;const indices={nose:0,left_shoulder:11,right_shoulder:12,left_elbow:13,right_elbow:14,left_wrist:15,right_wrist:16,left_hip:23,right_hip:24,left_knee:25,right_knee:26,left_ankle:27,right_ankle:28,left_foot_index:31,right_foot_index:32};async function getLandmarker(){if(landmarker)return landmarker;const {PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'IMAGE',numPoses:1});return landmarker}
$('detect').onclick=async()=>{if(!$('file').files.length){status('先に写真を選んでください。');return}const btn=$('detect');btn.disabled=true;status('姿勢検出モデルを読み込み中…');try{await $('reference').decode();const model=await getLandmarker();status('人物の姿勢を解析中…');const out=model.detect($('reference'));if(!out.landmarks?.length){status('人物を検出できませんでした。全身が写る写真をお試しください。');return}const lm=out.landmarks[0],world=out.worldLandmarks?.[0],use=world||lm,cx=(use[23].x+use[24].x)/2,cy=(use[23].y+use[24].y)/2,sy=(use[11].y+use[12].y)/2,scale=Math.min(1.17/Math.max(.08,Math.abs(cy-sy)),15);let next={};for(const [name,i] of Object.entries(indices)){const q=use[i];if(!q||(!world&&q.visibility!==undefined&&q.visibility<.22)){next[name]=base[name].clone();continue}next[name]=V((q.x-cx)*scale,1.62+(cy-q.y)*scale,(world?-q.z:q.z)*scale*.65)}if(!world)for(const q of Object.values(next))q.x*=-1;const ground=Math.min(next.left_ankle.y,next.right_ankle.y);for(const q of Object.values(next))q.y+=.19-ground;const dist=next.left_shoulder.distanceTo(next.right_shoulder);if(dist<.15||dist>3.5){status('姿勢の推定が不安定でした。別の写真をお試しください。');return}current=next;build(current);status('ポーズを反映しました。ドラッグで回転できます。奥行きは近似です。')}catch(err){console.error(err);status('検出エラー: '+(err.message||String(err)).slice(0,160))}finally{btn.disabled=false}};
function resize(){let w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();$('png').onclick=()=>{try{renderer.render(scene,camera);$('result').src=renderer.domElement.toDataURL('image/png');$('result').style.display='block';status('PNGを表示しました。画像を長押しして保存してください。');$('result').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){status('PNG生成に失敗しました: '+e.message)}};
}catch(e){console.error(e);status('3D表示エラー: '+e.message)}
</script></body></html>
