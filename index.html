<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoseMan 3D</title><style>body{margin:0;background:#f5f3f7;color:#28212d;font:15px system-ui}header{padding:14px 18px;background:white;font-size:21px;font-weight:800}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:14px;max-width:1200px;margin:auto}#view{height:75vh;min-height:480px;background:linear-gradient(#fff,#f5f1f5);border-radius:18px;overflow:hidden;position:relative}aside{background:white;border-radius:18px;padding:16px;max-height:80vh;overflow:auto}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px;background:#efdaeb;cursor:pointer}button.primary{background:#d450a1;color:white}.group{margin:14px 0;border-top:1px solid #eee;padding-top:12px}.parts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.parts label{font-size:13px;display:flex;align-items:center;gap:5px;padding:7px 4px;border-bottom:1px solid #f3eef3}.parts input{width:19px;height:19px;accent-color:#d450a1}.hint{font-size:12px;color:#777}input[type=range]{width:100%}#overlay{position:absolute;top:10px;left:10px;background:#ffffffbb;padding:8px;border-radius:8px;font-size:12px}#reference{max-width:100%;max-height:170px;object-fit:contain} @media(max-width:760px){main{display:block;padding:8px}#view{height:55vh;min-height:380px}aside{margin-top:10px;max-height:none}}</style></head><body><header>PoseMan <span style="color:#d450a1">3D</span></header><main><div id="view"><div id="overlay">ドラッグ：回転 / ピンチ：拡大 / 人形をタップ：部位選択</div></div><aside><b>写真・イラストのポーズを再現</b><p class="hint">参考画像を表示できます。人形は指で回転できます。写真からの自動ポーズ推定は未搭載です。</p><input id="file" type="file" accept="image/*"><img id="reference" hidden><div class="group"><b>ポーズ</b><p><select id="preset"><option value="neutral">基本姿勢</option><option value="raised">両手を上げる</option><option value="wave">片手を上げる</option><option value="squat">しゃがむ</option><option value="step">片脚を上げる</option></select> <button id="reset">初期化</button></p></div><div class="group"><b>強調したい部位</b><p class="hint">複数選択可。指と足指も個別に選べます。</p><div id="parts" class="parts"></div><label>白い光の強さ <span id="glowval">35%</span><input id="glow" type="range" min="0" max="100" value="35"></label><label>発光 <select id="style"><option value="soft">自然な白ピンク</option><option value="white">白い発光</option><option value="outline">白い輪郭風</option></select></label></div><div class="group"><button class="primary" id="save">PNGを表示</button> <button id="clear">強調を解除</button></div><div id="preview" hidden><p><b>PNGプレビュー</b>（画像を長押しして「写真に保存」）</p><img id="result" alt="生成したPNG" style="display:block;width:100%;max-width:520px;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 0 0/24px 24px;border-radius:12px"><p><a id="download" download="poseman.png">PNGファイルを開く・保存</a></p></div><p class="hint">Three.jsを利用。初回はインターネット接続が必要です。人形は独立した簡易3Dパーツで構成されています。</p></aside></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const view=document.getElementById('view'),scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(3,2.5,8.5);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,view.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;view.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.5,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0xd2a1c6,2.3));let light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-3,8,6);scene.add(light);
const material=new THREE.MeshStandardMaterial({color:0xe78ebc,roughness:.75,metalness:0});const highlighted=new Set(['左足裏','右足裏']);const nodes={},meshes=[];function group(name,parent,x=0,y=0,z=0){const g=new THREE.Group();g.name=name;g.position.set(x,y,z);parent.add(g);nodes[name]=g;return g}function mesh(name,parent,x,y,z,sx,sy,sz){let m=new THREE.Mesh(new THREE.SphereGeometry(1,18,14),material.clone());m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.userData.part=name;parent.add(m);meshes.push(m);return m}const root=group('全身',scene);mesh('胴体',root,0,2.9,0,.45,.75,.26);mesh('腰',root,0,2.25,0,.37,.25,.26);mesh('首',root,0,3.72,0,.14,.2,.14);mesh('頭',root,0,4.28,0,.48,.59,.42);
for(const [side,sgn] of [['左',-1],['右',1]]){const arm=group(side+'肩',root,sgn*.48,3.48,0);mesh(side+'上腕',arm,sgn*.14,-.36,0,.16,.43,.16);const elbow=group(side+'肘',arm,sgn*.25,-.72,0);mesh(side+'前腕',elbow,sgn*.02,-.31,0,.125,.36,.13);const wrist=group(side+'手首',elbow,sgn*.04,-.63,0);mesh(side+'手のひら',wrist,0,-.17,0,.19,.23,.085);for(let i=0;i<5;i++){let fx=sgn*((i-2)*.075);const finger=group(side+'手指'+(i+1),wrist,fx,-.34,.01);mesh(side+'手指'+(i+1),finger,0,-(i===0?.09:.15),0,.041,i===0?.12:.18,.045)}const hip=group(side+'股関節',root,sgn*.23,2.16,0);mesh(side+'太もも',hip,0,-.47,0,.22,.54,.22);const knee=group(side+'膝',hip,0,-.96,0);mesh(side+'すね',knee,0,-.45,0,.16,.5,.17);const ankle=group(side+'足首',knee,0,-.9,0);mesh(side+'足の甲',ankle,0,-.10,.19,.22,.15,.37);mesh(side+'足裏',ankle,0,-.22,.18,.23,.055,.36);mesh(side+'かかと',ankle,0,-.17,-.08,.19,.13,.18);for(let i=0;i<5;i++){const toe=group(side+'足指'+(i+1),ankle,(i-2)*.079,-.17,.47);mesh(side+'足指'+(i+1),toe,0,0,.075,.047,.055,.13)}}
function reset(){Object.values(nodes).forEach(g=>g.rotation.set(0,0,0));for(const [s,n] of [['左',-1],['右',1]])nodes[s+'肩'].rotation.z=-n*.45}function pose(p){reset();const r=x=>THREE.MathUtils.degToRad(x);if(p==='raised'){nodes['左肩'].rotation.z=r(160);nodes['右肩'].rotation.z=r(-160)}if(p==='wave'){nodes['右肩'].rotation.z=r(-135);nodes['右肘'].rotation.x=r(-30)}if(p==='squat'){for(const s of ['左','右']){nodes[s+'股関節'].rotation.x=r(-65);nodes[s+'膝'].rotation.x=r(105)}}if(p==='step'){nodes['右股関節'].rotation.x=r(-65);nodes['右膝'].rotation.x=r(75)}}document.getElementById('preset').onchange=e=>pose(e.target.value);document.getElementById('reset').onclick=()=>{document.getElementById('preset').value='neutral';reset()};
const parts=document.getElementById('parts');const partNames=[...new Set(meshes.map(m=>m.userData.part))];partNames.forEach(n=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=highlighted.has(n);c.onchange=()=>{c.checked?highlighted.add(n):highlighted.delete(n);paint()};l.append(c,document.createTextNode(n));parts.append(l)});const glow=document.getElementById('glow'),style=document.getElementById('style');function paint(){let strength=+glow.value/100;document.getElementById('glowval').textContent=glow.value+'%';for(const m of meshes){let yes=highlighted.has(m.userData.part);m.material.color.set(yes?(style.value==='white'?0xfff9ff:0xffd7ed):0xe78ebc);m.material.emissive.set(yes?0xffffff:0x000000);m.material.emissiveIntensity=yes?strength*(style.value==='outline'?.45:.75):0}}glow.oninput=style.onchange=paint;document.getElementById('clear').onclick=()=>{highlighted.clear();parts.querySelectorAll('input').forEach(x=>x.checked=false);paint()};const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-(window.downX??e.clientX))>5||Math.abs(e.clientY-(window.downY??e.clientY))>5)return;const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(meshes)[0];if(hit){let n=hit.object.userData.part;highlighted.has(n)?highlighted.delete(n):highlighted.add(n);parts.querySelectorAll('label').forEach(l=>{if(l.textContent===n)l.querySelector('input').checked=highlighted.has(n)});paint()}});renderer.domElement.addEventListener('pointerdown',e=>{window.downX=e.clientX;window.downY=e.clientY});document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(f){const img=document.getElementById('reference');img.src=URL.createObjectURL(f);img.hidden=false}};document.getElementById('save').onclick=()=>{renderer.render(scene,camera);const data=renderer.domElement.toDataURL('image/png');document.getElementById('result').src=data;document.getElementById('download').href=data;document.getElementById('preview').hidden=false;document.getElementById('preview').scrollIntoView({behavior:'smooth',block:'center'})};new ResizeObserver(()=>{const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(view);reset();paint();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>
