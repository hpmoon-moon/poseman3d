<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoseMan v5</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3f7;color:#382c39;font:15px -apple-system,sans-serif}header{padding:14px;background:white;font-size:21px;font-weight:bold}header span{color:#c95793}main{max-width:1150px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px}#view{height:76vh;min-height:430px;background:linear-gradient(white,#f3eaf2);border-radius:18px;position:relative;overflow:hidden;touch-action:none}aside{background:white;border-radius:18px;padding:18px}button{border:0;border-radius:10px;padding:12px;background:#eedeea;font:inherit;margin:5px 3px 5px 0}button.primary{background:#c34d90;color:white}button:disabled{opacity:.5}input{max-width:100%}#status{color:#665565;font-size:13px;white-space:pre-wrap;margin:12px 0;line-height:1.5}#reference{display:none;max-width:100%;max-height:220px;object-fit:contain;margin:12px 0}#result{display:none;width:100%;margin-top:10px;border:1px solid #ddd}small{color:#796e79}#view label{position:absolute;top:10px;left:10px;font-size:12px;background:#ffffffc9;border-radius:8px;padding:7px;z-index:1}canvas{display:block}@media(max-width:760px){main{display:block;padding:8px}#view{height:54vh;min-height:360px}aside{margin-top:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header>PoseMan <span>3D v5</span></header><main><div id="view"><label>ドラッグ：回転 ／ ピンチ：拡大</label></div><aside><h3>写真からポーズを自動再現</h3><small>人物全身が見える写真を選択してください。初回はネット接続が必要です。</small><p><input id="file" type="file" accept="image/*"></p><img id="reference" alt="参考画像"><div><button class="primary" id="detect">写真から自動再現</button><button id="reset">基本姿勢</button></div><p id="status">3Dモデルを読み込んでいます…</p><hr><h3>足裏ハイライト</h3><small>左右の足裏全体を白ピンク色でやさしく発光（固定）。</small><hr><button class="primary" id="png">PNGを表示</button><img id="result" alt="透過PNG"><p><small>画像を長押しして保存できます。写真1枚からの奥行きや隠れた関節は近似です。手指・足指の個別ポーズ推定には対応しません。</small></p></aside></main><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(0,1.65,8.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;$('view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.7,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=2.5;controls.maxDistance=14;
scene.add(new THREE.HemisphereLight(0xffffff,0xe0a5bb,2.3));let light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-3,6,5);scene.add(light);light=new THREE.DirectionalLight(0xffc1db,1.2);light.position.set(3,2,-4);scene.add(light);
const skin=new THREE.MeshStandardMaterial({color:0xee8fba,roughness:.84}),soleMat=new THREE.MeshStandardMaterial({color:0xffddeb,emissive:0xffbedf,emissiveIntensity:.4,roughness:.72});
const body=new THREE.Group();scene.add(body);const sphere=new THREE.SphereGeometry(1,32,24),V=(x,y,z=0)=>new THREE.Vector3(x,y,z);
const base={nose:V(0,3.27),left_shoulder:V(-.42,2.69),right_shoulder:V(.42,2.69),left_elbow:V(-.66,2.22),right_elbow:V(.66,2.22),left_wrist:V(-.8,1.82),right_wrist:V(.8,1.82),left_hip:V(-.23,1.58),right_hip:V(.23,1.58),left_knee:V(-.25,.91),right_knee:V(.25,.91),left_ankle:V(-.25,.2),right_ankle:V(.25,.2),left_foot_index:V(-.25,.12,.23),right_foot_index:V(.25,.12,.23)};
const baseCopy=()=>Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v.clone()]));
function ellipsoid(pos,scale,mat=skin,parent=body){let m=new THREE.Mesh(sphere,mat);m.position.copy(pos);m.scale.set(...scale);parent.add(m);return m}
function capsule(a,b,rA,rB,mat=skin){const d=b.clone().sub(a),len=d.length();if(len<.001)return;const mid=a.clone().add(b).multiplyScalar(.5);const g=new THREE.CylinderGeometry(rB,rA,len,24,1,false);const m=new THREE.Mesh(g,mat);m.position.copy(mid);m.quaternion.setFromUnitVectors(V(0,1),d.normalize());body.add(m);ellipsoid(a,[rA,rA,rA],mat);ellipsoid(b,[rB,rB,rB],mat);return m}
function build(j){body.clear();const hip=j.left_hip.clone().add(j.right_hip).multiplyScalar(.5),shoulder=j.left_shoulder.clone().add(j.right_shoulder).multiplyScalar(.5),center=hip.clone().add(shoulder).multiplyScalar(.5);let torso=ellipsoid(center,[.37,.67,.22]);torso.quaternion.setFromUnitVectors(V(0,1),shoulder.clone().sub(hip).normalize());ellipsoid(hip,[.32,.23,.23]);let head=j.nose.clone().add(V(0,.14));ellipsoid(head,[.33,.43,.31]);capsule(shoulder.clone().add(V(0,.06)),head.clone().add(V(0,-.35)),.135,.14);
for(const side of ['left','right']){const s=j[side+'_shoulder'],e=j[side+'_elbow'],w=j[side+'_wrist'],h=j[side+'_hip'],k=j[side+'_knee'],a=j[side+'_ankle'],f=j[side+'_foot_index'];capsule(s,e,.145,.105);capsule(e,w,.105,.075);const hand=w.clone().add(w.clone().sub(e).normalize().multiplyScalar(.13));ellipsoid(hand,[.12,.16,.065]);const dir=w.clone().sub(e).normalize();for(let i=0;i<5;i++){let offset=(i-2)*.046;const root=hand.clone().add(V(offset,0,.015)),tip=root.clone().add(dir.clone().multiplyScalar(.16-(Math.abs(i-2)*.015)));capsule(root,tip,.018,.014)}capsule(h,k,.185,.125);capsule(k,a,.125,.085);const foot=a.clone().add(V(0,-.085,.14));let fm=ellipsoid(foot,[.16,.09,.29]);fm.quaternion.setFromUnitVectors(V(0,0,1),f.clone().sub(a).normalize());for(let i=0;i<5;i++){let dx=(i-2)*.055;ellipsoid(foot.clone().add(V(dx,-.004,.205)),[.029,.034,.07])}const sole=ellipsoid(foot.clone().add(V(0,-.073,.03)),[.145,.025,.25],soleMat);sole.quaternion.copy(fm.quaternion);
}}
let current=baseCopy();build(current);
$('reset').onclick=()=>{current=baseCopy();build(current);status('基本姿勢に戻しました。')};
$('file').onchange=()=>{const file=$('file').files[0];if(!file)return;const img=$('reference');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url=URL.createObjectURL(file);img.src=img.dataset.url;img.style.display='block';status('画像を読み込みました。「写真から自動再現」を押してください。')};
let detector=null;
async function loadDetector(){if(detector)return detector;const url='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';let mod;try{mod=await import(url)}catch(e){throw new Error('MediaPipeの読み込みに失敗しました。通信・CDNを確認してください（'+e.message+'）')}const vision=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');detector=await mod.PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'IMAGE',numPoses:1});return detector}
const ids={nose:0,left_shoulder:11,right_shoulder:12,left_elbow:13,right_elbow:14,left_wrist:15,right_wrist:16,left_hip:23,right_hip:24,left_knee:25,right_knee:26,left_ankle:27,right_ankle:28,left_foot_index:31,right_foot_index:32};
$('detect').onclick=async()=>{if(!$('file').files.length){status('写真を選択してください。');return}let btn=$('detect');btn.disabled=true;try{status('姿勢検出モデルを読み込んでいます…');await $('reference').decode();const model=await loadDetector();status('姿勢を解析しています…');const output=model.detect($('reference'));if(!output.landmarks?.length){status('人物が検出されませんでした。別の全身写真を試してください。');return}const lm=output.landmarks[0],world=output.worldLandmarks?.[0],use=world||lm;const cx=(use[23].x+use[24].x)/2,cy=(use[23].y+use[24].y)/2,sy=(use[11].y+use[12].y)/2;const scale=Math.min(15,1.1/Math.max(.08,Math.abs(cy-sy)));let next={};for(const [name,i]of Object.entries(ids)){let p=use[i];next[name]=p?V((p.x-cx)*scale*(world?1:-1),1.58-(p.y-cy)*scale,-p.z*scale*.55):base[name].clone()}let ground=Math.min(next.left_ankle.y,next.right_ankle.y);for(let p of Object.values(next))p.y+=.2-ground;current=next;build(current);status('ポーズを反映しました。写真1枚からの推定なので奥行きは近似です。')}catch(e){console.error(e);status('検出エラー：'+(e.message||String(e)))}finally{btn.disabled=false}};
function resize(){const el=$('view'),w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();status('3Dモデルを表示しました。写真を選択してください。');
$('png').onclick=()=>{try{renderer.render(scene,camera);$('result').src=renderer.domElement.toDataURL('image/png');$('result').style.display='block';status('PNGを表示しました。画像を長押しして保存できます。');$('result').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){status('PNG生成エラー：'+e.message)}};
</script></body></html>
